[package]
name = "parity-gen"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "parity-gen"
path = "main.rs"

[dependencies]
async-trait = "0.1"
morpheum-sdk-core = { path = "/tmp/morpheum-sdk/crates/core", features = ["std"] }
morpheum-sdk-position = { path = "/tmp/morpheum-sdk/crates/position", features = ["std"] }
morpheum-sdk-risk = { path = "/tmp/morpheum-sdk/crates/risk", features = ["std"] }
morpheum-sdk-bucket = { path = "/tmp/morpheum-sdk/crates/bucket", features = ["std"] }
morpheum-sdk-clob = { path = "/tmp/morpheum-sdk/crates/clob", features = ["std"] }
morpheum-proto = { path = "/tmp/morpheum-proto", default-features = false, features = ["std"] }
prost = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
